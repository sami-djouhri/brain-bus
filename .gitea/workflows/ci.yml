# CI-Vorlage Python (ZIELBILD 46 B1), Quelle: interne Notiz.
# Je Repo verschieden ist NUR der env-Block (und das Image aus der Liste in pruefen.py);
# alles andere prueft `pruefen.py` gegen diese Vorlage. Aenderungen hier machen, dann
# `python3 pruefen.py --verteilen` in jedes Repo der Liste.
#
# Kein actions/checkout: der Runner erreicht weder GitHub-Actions im Haus noch
#   gitea.home.arpa (ROOT_URL). Der Quelltext kommt als Archiv ueber die API von
#   192.0.2.10:8103, dafuer reicht Python im Image.
# Image von mirror.gcr.io (Docker-Hub-Spiegel von Google) statt Docker Hub, das die
#   gemeinsame Heim-IP drosselt; fest per Digest, Renovate zieht nach.
# Mindestzahl: ein Lauf mit weniger Tests als CI_MINDEST ist rot, auch wenn alle
#   gruen sind. Fehlt eine Testabhaengigkeit, laden pytest und unittest ganze Module
#   still nicht (Kalender 2026-09: 147 statt 192).
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CI_PIP: "-r requirements.txt"
  CI_TESTS: "python -m pytest -q"
  CI_MINDEST: "82"
  CI_RUFF: "--select E9,F63,F7,F82"
  CI_APT: ""

jobs:
  test:
    runs-on: homelab
    timeout-minutes: 20
    container:
      image: mirror.gcr.io/library/python:3.13-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
    steps:
      - name: Quelltext holen
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import io, os, tarfile, urllib.request
          url = f"http://192.0.2.10:8103/api/v1/repos/{os.environ['REPO']}/archive/{os.environ['SHA']}.tar.gz"
          anfrage = urllib.request.Request(url, headers={"Authorization": f"token {os.environ['TOKEN']}"})
          with urllib.request.urlopen(anfrage, timeout=120) as antwort:
              daten = antwort.read()
          # Gitea legt das Archiv ohne Wurzelordner an, die Dateien liegen direkt oben.
          with tarfile.open(fileobj=io.BytesIO(daten)) as tar:
              tar.extractall(".", filter="data")
          print(f"{len(daten)} Bytes, Stand {os.environ['SHA'][:10]}")
          PY

      # Hausregeln (leitstand #14): Kopie aus docker/scripts/hausregeln, verteilt von
      # pruefen.py. Rot nur bei einem Verstoss, der nicht in der Grundlinie steht.
      - name: Hausregeln
        run: |
          python -m pip install -q --disable-pip-version-check --root-user-action=ignore pyyaml
          python .gitea/hausregeln.py .

      # Ruff vor der Installation: `pip install .` legt build/ im Baum an, und ruff
      # meldete dort jeden Fund doppelt.
      - name: Ruff
        run: |
          python -m pip install -q --disable-pip-version-check --root-user-action=ignore ruff pytest
          python -m ruff check $CI_RUFF .

      - name: Abhaengigkeiten
        run: |
          if [ -n "$CI_APT" ]; then
            apt-get update -qq && apt-get install -y -qq --no-install-recommends $CI_APT > /dev/null
          fi
          python -m pip install -q --disable-pip-version-check --root-user-action=ignore $CI_PIP

      - name: Tests
        run: |
          set +e
          sh -c "$CI_TESTS" > /tmp/tests.log 2>&1
          rc=$?
          set -e
          cat /tmp/tests.log
          gelaufen=$(python3 - <<'PY'
          import re
          text = open("/tmp/tests.log", encoding="utf-8", errors="replace").read()
          m = re.findall(r"^Ran (\d+) tests?", text, re.M)
          if m:
              print(m[-1])
          else:
              zahlen = re.findall(r"(\d+) (?:passed|failed|error|errors|skipped|xfailed|xpassed)", text.splitlines()[-1] if text.strip() else "")
              print(sum(int(z) for z in zahlen))
          PY
          )
          # "aus:<datei>" liest MINDEST_TESTS=<n> oder ERWARTET=<n> aus der Datei des Repos,
          # damit die Zahl nur an einer Stelle steht (kalender, mobile-api, tardis: run-tests.sh).
          mindest="$CI_MINDEST"
          case "$mindest" in
            aus:*) mindest=$(sed -n 's/^\(MINDEST_TESTS\|ERWARTET\)=\([0-9]\{1,\}\).*/\2/p' "${mindest#aus:}" | head -1) ;;
          esac
          echo "gelaufen: $gelaufen, mindestens: ${mindest:-?}, Rueckgabe: $rc"
          if [ -z "$mindest" ] || [ "$gelaufen" -lt "$mindest" ]; then
            echo "FEHLER: zu wenige Tests gelaufen, eine Testabhaengigkeit fehlt vermutlich" >&2
            exit 1
          fi
          exit $rc

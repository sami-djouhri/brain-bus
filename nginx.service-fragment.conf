# Eigen-Service unter /brain-bus/ (ersetze "brain-bus" überall)
# In dev-portal/nginx.conf einfügen, dann nginx reloaden.

location /brain-bus/api/ {
    auth_request /internal/authelia;
    auth_request_set $auth_user $upstream_http_remote_user;
    auth_request_set $auth_groups $upstream_http_remote_groups;

    proxy_set_header Remote-User $auth_user;
    proxy_set_header Remote-Groups $auth_groups;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_pass http://brain-bus:8000/api/;
}

location /brain-bus/health {
    proxy_pass http://brain-bus:8000/health;
    access_log off;
}

location /brain-bus/ {
    auth_request /internal/authelia;
    auth_request_set $auth_user $upstream_http_remote_user;
    auth_request_set $auth_groups $upstream_http_remote_groups;

    error_page 401 = @authelia_signin;

    proxy_set_header Remote-User $auth_user;
    proxy_set_header Remote-Groups $auth_groups;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_pass http://brain-bus:8000/;
}
